[workspace]
resolver = "2"
members = [
    "crates/napster-proto",
    "crates/napster-server",
    "crates/napster-core",
    "crates/napster-gui",
    "crates/napster-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
napster-proto = { path = "crates/napster-proto" }
napster-core = { path = "crates/napster-core" }
napster-server = { path = "crates/napster-server" }

anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures = "0.3"
md-5 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[profile.release]
lto = "thin"
