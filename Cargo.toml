[workspace]
resolver = "2"
members = [
    "crates/napster-proto",
    "crates/napster-server",
    "crates/napster-core",
    "crates/napster-gui",
    "crates/napster-cli",
    "crates/napster-sign",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
napster-proto = { path = "crates/napster-proto" }
napster-core = { path = "crates/napster-core" }
napster-server = { path = "crates/napster-server" }

anyhow = "1"
base64 = "0.22"
bytes = "1"
ed25519-dalek = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures = "0.3"
md-5 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

# password hashing is unbearably slow unoptimized (tests, debug builds)
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
